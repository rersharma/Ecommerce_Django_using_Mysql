{% extends 'common/admin_dashboard.html' %}
{% block title %} Add Product {% endblock %}

{% block content %}

<div class="container mt-5">

     <div class="row">

         <div class="col-sm-5 offset-sm-3 p-2" style="border:1px solid gray;">

             <h1 class="text-center bg-primary text-white">Add Product</h1>
             <form action="{% url 'add_product' %}" method="post" enctype="multipart/form-data">

                 {% csrf_token %}
                 <div class="mt-2">
                       <label for="pname">Product Name</label>
                       <input type="text" name="pname" required class="form-control">
                 </div>

                 <div class="mt-2">
                       <label for="ptype">Product Type</label>
                        <select name="ptype" required class="form-control">
                         <option value="" selected disabled>Select Product Type</option>
                         <option>Electronic</option>
                         <option>Cloth</option>
                         <option>Grocery</option>
                         <option>Furniture</option>
                        </select>
                 </div>

                  <div class="mt-2">
                       <label for="pprice">Product Price</label>
                       <input type="number" name="pprice" required class="form-control">
                 </div>

                  <div class="mt-2">
                       <label for="pphoto">Product Photo</label>
                       <input type="file" name="pphoto" required class="form-control">
                 </div>

                  <div class="mt-2">
                       <label for="pdesc">Product Description</label>
                       <textarea name="pdesc" required class="form-control"></textarea>
                 </div>

                   <div class="mt-2">
                       <button class="btn btn-primary">Add Product</button>
                 </div>
             </form>
              <div class="mt-2 text-center">
                          {% if messages %}
                          {% for message in messages %}
                          <div class="alert alert-success">
                             {{message}}
                          </div>
                          {% endfor %}
                          {% endif %}
                </div>
         </div>

     </div>

</div>

{% endblock %}
